name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgepm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forgepm_test
      REDIS_URL: redis://localhost:6379
      # Throwaway 32-byte key (base64) so scripts that call loadEnv (gen:api)
      # validate. Real secrets live in the `secrets` table; nothing sensitive
      # here — this value is documented as a fixed dev placeholder.
      FORGEPM_SECRET_KEY: Zm9yZ2VwbS1jaS10aHJvd2F3YXkta2V5LTMyYnl0ZXM=
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace libs (shared+core) for tsx scripts
        # scripts/*.ts import @forgepm/{shared,core}, whose package.json "main"
        # points at dist/. Locally dist may already exist; on a clean CI runner
        # it must be built before any tsx script runs.
        run: pnpm --filter @forgepm/shared --filter @forgepm/core run build

      - name: Migration hash guard (merged migrations must not be edited)
        run: node scripts/check-migration-hashes.mjs

      - name: "Migrations on an empty DB"
        run: pnpm migrate

      - name: Verify (lint, typecheck, unit+integration+coverage, build)
        run: pnpm verify

      - name: "gen:api drift check (OpenAPI spec + typed client are committed)"
        run: pnpm gen:api:check

      - name: "Panel build (Angular) + Playwright flagship E2E"
        run: |
          corepack enable
          (cd apps/web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium)
          bash apps/web/e2e.sh

      - name: "schema:check (live vs DATA_MODEL.md)"
        run: pnpm schema:check

      - name: "schema:check must fail on a deliberate diff"
        run: node scripts/schema-check-selftest.mjs

      - name: "docs:check"
        run: pnpm docs:check

      - name: phase-report script self-test (local/remote lines)
        run: node scripts/phase-report-selftest.mjs

      - name: "docker compose up + health smoke (five services)"
        run: |
          export FORGEPM_SECRET_KEY=$(openssl rand -base64 32)
          if ! docker compose up -d --build --wait --wait-timeout 180; then
            echo "---- compose ps ----"; docker compose ps -a
            echo "---- api logs ----"; docker compose logs --no-color api || true
            echo "---- worker logs ----"; docker compose logs --no-color worker || true
            exit 1
          fi
          curl -fsS http://localhost:3001/health/ready | grep -q '"status":"ok"'
          docker compose ps
          docker compose down -v

      - name: pnpm audit (production deps; high+ fails)
        # The shipped surface is the production dependency tree. Dev-only
        # advisories with no upstream patch (see docs/SECURITY.md "Audit
        # exceptions") are reviewed, not silently ignored, via --prod.
        run: pnpm audit --prod --audit-level=high
