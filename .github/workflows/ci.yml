name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgepm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forgepm_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway FORGEPM_SECRET_KEY
        # Scripts that call loadEnv (gen:api) need a valid 32-byte base64 key.
        # It is generated fresh per run and never committed — real secrets live
        # in the `secrets` table (§3b-1.5), and this job touches none.
        run: echo "FORGEPM_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace libs (shared+core) for tsx scripts
        # scripts/*.ts import @forgepm/{shared,core}, whose package.json "main"
        # points at dist/. Locally dist may already exist; on a clean CI runner
        # it must be built before any tsx script runs.
        run: pnpm --filter @forgepm/shared --filter @forgepm/core run build

      - name: Migration hash guard (merged migrations must not be edited)
        run: node scripts/check-migration-hashes.mjs

      - name: "Migrations on an empty DB"
        run: pnpm migrate

      - name: Verify (lint, typecheck, unit+integration+coverage, build)
        run: pnpm verify

      - name: "gen:api drift check (OpenAPI spec + typed client are committed)"
        run: pnpm gen:api:check

      - name: "Panel build (Angular) + Playwright flagship E2E"
        run: |
          corepack enable
          (cd apps/web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium)
          bash apps/web/e2e.sh

      - name: "i18n key parity check (plan §11)"
        run: (cd apps/web && node scripts/i18n-check.mjs)

      - name: "Performance budget: seed + pnpm perf + P-05 first paint (plan §3b-7/§11)"
        run: |
          # dedicated perf dataset DB — never the functional test DB
          export PERF_DB_URL="postgres://postgres:postgres@localhost:5432/forgepm_perf"
          psql "postgres://postgres:postgres@localhost:5432/postgres" -qc "CREATE DATABASE forgepm_perf"
          DATABASE_URL="$PERF_DB_URL" pnpm seed:perf | tee /tmp/seed-perf.log
          PERF_API_KEY="$(grep -oE 'fpm_[a-z0-9]+' /tmp/seed-perf.log | head -1)"
          (DATABASE_URL="$PERF_DB_URL" REDIS_URL="$REDIS_URL" FORGEPM_SECRET_KEY="$FORGEPM_SECRET_KEY" PORT=3101 HOST=127.0.0.1 LOG_LEVEL=fatal node apps/api/dist/main.js & echo $! > /tmp/perf-api.pid)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3101/health/live >/dev/null && break; sleep 1; done
          DATABASE_URL="$PERF_DB_URL" PERF_API_KEY="$PERF_API_KEY" pnpm perf
          kill "$(cat /tmp/perf-api.pid)" 2>/dev/null || true

      - name: "P-05 panel first paint through Playwright (perf dataset)"
        run: |
          # e2e-perf.sh seeds (idempotent: reuses forgepm_perf above) and boots
          # its own API+dev-server against the 500k dataset.
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres" bash apps/web/e2e-perf.sh

      - name: "schema:check (live vs DATA_MODEL.md)"
        run: pnpm schema:check

      - name: "schema:check must fail on a deliberate diff"
        run: node scripts/schema-check-selftest.mjs

      - name: "docs:check"
        run: pnpm docs:check

      - name: phase-report script self-test (local/remote lines)
        run: node scripts/phase-report-selftest.mjs

      - name: "docker compose up + health smoke (five services)"
        run: |
          export FORGEPM_SECRET_KEY=$(openssl rand -base64 32)
          if ! docker compose up -d --build --wait --wait-timeout 180; then
            echo "---- compose ps ----"; docker compose ps -a
            echo "---- api logs ----"; docker compose logs --no-color api || true
            echo "---- worker logs ----"; docker compose logs --no-color worker || true
            exit 1
          fi
          curl -fsS http://localhost:3001/health/ready | grep -q '"status":"ok"'
          docker compose ps
          docker compose down -v

      - name: pnpm audit (production deps; high+ fails)
        # The shipped surface is the production dependency tree. Dev-only
        # advisories with no upstream patch (see docs/SECURITY.md "Audit
        # exceptions") are reviewed, not silently ignored, via --prod.
        run: pnpm audit --prod --audit-level=high
