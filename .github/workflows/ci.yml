name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgepm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forgepm_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migration hash guard (merged migrations must not be edited)
        run: node scripts/check-migration-hashes.mjs

      - name: Migrations on an empty DB (already done by tests; explicit here)
        run: pnpm migrate

      - name: Verify (lint, typecheck, unit+integration+coverage, build)
        run: pnpm verify

      - name: schema:check (live vs DATA_MODEL.md)
        run: pnpm schema:check

      - name: schema:check must fail on a deliberate diff
        run: node scripts/schema-check-selftest.mjs

      - name: docs:check
        run: pnpm docs:check

      - name: phase-report script self-test (local/remote lines)
        run: node scripts/phase-report-selftest.mjs

      - name: docker compose up + health smoke (plan §4: five services healthy)
        run: |
          export FORGEPM_SECRET_KEY=$(openssl rand -base64 32)
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:3001/health/ready | grep -q '"status":"ok"'
          docker compose ps
          docker compose down -v

      - name: pnpm audit (high+ fails the build)
        run: pnpm audit --audit-level=high
