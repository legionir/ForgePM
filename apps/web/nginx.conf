server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # strict CSP for the panel (plan §14). Angular ships one inline bootstrap
  # script; 'unsafe-inline' is scoped to script-src to keep that minimal.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # same-origin API: the panel talks to /api/v1 (session cookie is first-party)
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health/ {
    proxy_pass http://api:3001;
  }

  # SPA fallback so deep links (client-side routes) resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
