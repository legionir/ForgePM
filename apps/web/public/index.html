<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ForgePM</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; min-height: 100vh;
           display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
    main { text-align: center; padding: 3rem 1.5rem; max-width: 42rem; }
    h1 { font-size: 2.4rem; margin: 0 0 .5rem; }
    p { line-height: 1.9; color: #94a3b8; }
    .badge { display: inline-block; margin-top: 1.5rem; padding: .35rem .9rem; border-radius: 999px;
             background: #1e293b; color: #7dd3fc; font-size: .85rem; }
    button { margin-top: 2rem; background: none; border: 1px solid #334155; color: #cbd5e1;
             padding: .4rem 1rem; border-radius: .5rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">ForgePM</h1>
    <p id="tagline">پلتفرم self-hosted برنامه‌ریزی و مدیریت مهندسی — هسته مستقل از AI و GitHub، تعامل از طریق MCP.</p>
    <span class="badge">Phase 0 · v0.0.0</span>
    <div><button id="lang" type="button">Switch to English</button></div>
  </main>
  <script>
    const texts = {
      fa: { dir: 'rtl', lang: 'fa',
            tagline: 'پلتفرم self-hosted برنامه‌ریزی و مدیریت مهندسی — هسته مستقل از AI و GitHub، تعامل از طریق MCP.',
            btn: 'Switch to English' },
      en: { dir: 'ltr', lang: 'en',
            tagline: 'Self-hosted engineering planning & management platform — core runs without AI or GitHub; agents interact via MCP.',
            btn: 'به فارسی عوض کن' },
    };
    let cur = 'fa';
    document.getElementById('lang').addEventListener('click', () => {
      cur = cur === 'fa' ? 'en' : 'fa';
      const t = texts[cur];
      const html = document.documentElement;
      html.dir = t.dir; html.lang = t.lang;
      document.getElementById('tagline').textContent = t.tagline;
      document.getElementById('lang').textContent = t.btn;
    });
  </script>
</body>
</html>
