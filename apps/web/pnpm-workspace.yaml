# apps/web is a standalone pnpm workspace (Angular panel). It is intentionally
# NOT a member of the repo-root workspace: it pins TypeScript 6.x (Angular 22)
# while the backend pins 5.7.x, so a shared install would conflict. The panel's
# build/E2E gates run from here (`bash apps/web/e2e.sh`).
packages:
  - "."

allowBuilds:
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  '@parcel/watcher': true
