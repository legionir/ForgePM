packages:
  # Backend workspace: packages/core, packages/shared, apps/api, apps/worker
  # and tests. apps/web (Angular panel) stays outside the workspace on purpose
  # because it pins its own TypeScript major (6.x) — running `pnpm -r build`
  # here would conflict with the backend's TS 5.7. The panel has its own
  # install, its own Angular builder, its own lint and Playwright gates
  # (`apps/web/e2e.sh`). Phase 7 acceptance runs both: backend `pnpm verify`
  # and the panel E2E script.
  - "packages/*"
  - "apps/api"
  - "apps/worker"
  - "tests"

allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@fastify/rate-limit@11.2.1'
